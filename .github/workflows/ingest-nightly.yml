name: ingest-nightly
on:
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
concurrency: { group: ingest, cancel-in-progress: false }
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify workspace graph
        run: pnpm verify-graph
      - run: pnpm --filter @camefa/engine-ingest build
      - run: pnpm --filter @camefa/engine-ingest typecheck
      - name: Ingestion runtime note
        run: echo "Ingestion CLI is compile-verified; source/target corpus execution remains deployment-specific."
