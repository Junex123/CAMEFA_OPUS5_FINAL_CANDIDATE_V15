name: decision-regression
on:
  pull_request:
    paths: ['packages/engine-**/**', 'ontology-packs/**', 'eval/golden/**', 'eval/thresholds.json']
concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Verify workspace graph
        run: pnpm verify-graph
      - run: pnpm turbo run build --filter=@camefa/engine-eval...
      - name: Replay golden set
        env: { BASELINE_URL: ${{ secrets.RECEIPT_BASELINE_URL }} }
        run: |
          pnpm --filter @camefa/engine-eval exec camefa-eval --set-id=core --golden=eval/golden/core.json --waivers=eval/waivers.json --thresholds=eval/thresholds.json --engine-config=eval/engine.candidate.json --baseline-url="$BASELINE_URL" --web-base-url=https://camefa.app --out-json=eval-run.json --out-md=eval-report.md
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: eval-run, path: "eval-run.json\neval-report.md" }
      - if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with: { header: decision-regression, path: eval-report.md }
